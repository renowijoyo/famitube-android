name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName=1.0.${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamiTube-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Remove old APK assets from latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view latest --json assets --jq '.assets[].name' 2>/dev/null || true)
          for asset in $assets; do
            if [[ "$asset" == *.apk ]]; then
              gh release delete-asset latest "$asset" -y || true
            fi
          done

      - name: Publish to Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FamiTube Android (Latest)
          make_latest: true
          overwrite_files: true
          files: app/build/outputs/apk/debug/*.apk
