<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FamiTube H5P Interactive Activity Player</title>
  <style>
    :root {
      --bg: #0F1117;
      --surface: #1A1D27;
      --surface-var: #242938;
      --border: #2D3348;
      --text: #F1F3F9;
      --text-muted: #8E99B0;
      --pink: #FF2E93;
      --blue: #4361EE;
      --cyan: #00B4D8;
      --green: #06D6A0;
      --gold: #FFD166;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .h5p-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(67, 97, 238, 0.15);
      border: 1px solid var(--blue);
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 800;
      color: #70a1ff;
      margin-bottom: 8px;
    }
    .h5p-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .btn {
      background: var(--blue);
      color: #fff;
      font-weight: 800;
      border: none;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-pink { background: var(--pink); }
    .btn-green { background: var(--green); color: #000; }
    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text);
    }
    .quiz-display {
      background: #111420;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--gold);
      margin: 12px 0;
      border: 1px solid var(--border);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .choice-btn {
      background: var(--surface-var);
      border: 1.5px solid var(--border);
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 800;
      padding: 14px 10px;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
    }
    .choice-btn.correct {
      background: var(--green) !important;
      color: #000 !important;
      border-color: var(--green) !important;
    }
    .choice-btn.wrong {
      background: #EF476F !important;
      color: #fff !important;
      border-color: #EF476F !important;
    }
    /* Memory card */
    .mem-card {
      aspect-ratio: 1;
      border-radius: 12px;
      background: var(--surface-var);
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mem-card.flipped {
      background: #252d42;
      border-color: var(--blue);
    }
    .mem-card.matched {
      background: rgba(6, 214, 160, 0.25);
      border-color: var(--green);
    }
    /* Drag Words */
    .drop-zone {
      display: inline-block;
      min-width: 80px;
      height: 32px;
      line-height: 30px;
      padding: 0 10px;
      border-radius: 8px;
      border: 2px dashed var(--gold);
      background: rgba(255, 209, 102, 0.1);
      color: var(--gold);
      font-weight: 800;
      text-align: center;
      vertical-align: middle;
      margin: 0 4px;
    }
    .drop-zone.filled {
      border-style: solid;
      background: var(--surface-var);
      color: var(--cyan);
    }
    .word-chip {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 10px;
      background: var(--surface-var);
      border: 1.5px solid var(--border);
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
      margin: 4px;
    }
    .word-chip.selected {
      background: var(--blue);
      border-color: #70a1ff;
      color: #fff;
    }
    #celebration-banner {
      display: none;
      background: linear-gradient(135deg, rgba(6,214,160,0.2), rgba(255,209,102,0.2));
      border: 1.5px solid var(--green);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      margin-top: 14px;
      animation: popIn 0.3s ease-out;
    }
    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="h5p-header" style="margin-bottom:10px;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div class="h5p-badge">
        <span>📦 H5P Open-Source Activity</span>
      </div>
      <div id="h5p-stars-badge" style="padding:4px 10px; border-radius:99px; background:rgba(255,209,102,0.15); border:1px solid var(--gold); font-weight:800; font-size:0.8rem; color:var(--gold);">
        ⭐ +15 Available
      </div>
    </div>
    <div id="h5p-title" style="font-weight:900; font-size:1.1rem;">H5P Interactive Quest</div>
    <div id="h5p-desc" style="font-size:0.75rem; color:var(--text-muted); margin-top:2px;">Complete the activity to earn star points!</div>
  </div>

  <div id="h5p-container" class="h5p-card">
    <!-- H5P Content loads here -->
  </div>

  <div id="celebration-banner">
    <div style="font-size:1.6rem; margin-bottom:4px;">🎉 ⭐ 🏆</div>
    <div id="celeb-title" style="font-weight:900; font-size:1.05rem; color:var(--green);">Activity Completed!</div>
    <div id="celeb-stars" style="font-weight:800; font-size:0.88rem; color:var(--gold); margin-top:3px;">+15 ⭐ Stars Awarded!</div>
  </div>

  <script>
    // ==========================================
    // H5P RUNTIME CORE & XAPI DISPATCHER
    // ==========================================
    window.H5P = window.H5P || {};
    
    H5P.EventDispatcher = function() {
      this.listeners = {};
    };
    H5P.EventDispatcher.prototype.on = function(type, listener) {
      if (!this.listeners[type]) this.listeners[type] = [];
      this.listeners[type].push(listener);
    };
    H5P.EventDispatcher.prototype.trigger = function(type, data) {
      if (!this.listeners[type]) return;
      for (let i = 0; i < this.listeners[type].length; i++) {
        this.listeners[type][i](data);
      }
    };

    H5P.externalDispatcher = new H5P.EventDispatcher();

    H5P.XAPIEvent = function(verb, score, maxScore, title) {
      this.data = {
        statement: {
          actor: { name: "FamiTube Child Learner" },
          verb: { id: "http://adlnet.gov/expapi/verbs/" + verb },
          object: {
            definition: {
              name: { "en-US": title }
            }
          },
          result: {
            score: { raw: score, max: maxScore, scaled: maxScore > 0 ? (score / maxScore) : 1 },
            completion: true,
            success: (score / (maxScore || 1)) >= 0.6
          }
        }
      };
      this.getScore = function() { return score; };
      this.getMaxScore = function() { return maxScore; };
      this.getVerb = function() { return verb; };
    };

    // Attach global xAPI listener to reward stars & notify Android / Web host
    H5P.externalDispatcher.on('xAPI', function(event) {
      const stmt = event.data.statement;
      if (stmt && stmt.verb && (stmt.verb.id.endsWith('completed') || stmt.verb.id.endsWith('passed'))) {
        const score = event.getScore ? event.getScore() : 10;
        const maxScore = event.getMaxScore ? event.getMaxScore() : 10;
        const ratio = maxScore > 0 ? (score / maxScore) : 1;
        const stars = Math.max(5, Math.min(25, Math.round(ratio * 15)));
        const title = (stmt.object && stmt.object.definition && stmt.object.definition.name) ? stmt.object.definition.name['en-US'] : 'H5P Quest';
        
        // Notify native Android bridge if running in Android WebView
        if (window.FamiTubeAndroid && typeof window.FamiTubeAndroid.onXAPICompleted === 'function') {
          window.FamiTubeAndroid.onXAPICompleted(score, maxScore, stars, title);
        }

        // Notify Web parent if embedded in iframe
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'H5P_COMPLETED', score: score, maxScore: maxScore, stars: stars, title: title }, '*');
        }

        // Show local banner
        showCelebration(stars, title, score, maxScore);
      }
    });

    function showCelebration(stars, title, score, maxScore) {
      const banner = document.getElementById('celebration-banner');
      const titleEl = document.getElementById('celeb-title');
      const starsEl = document.getElementById('celeb-stars');
      if (banner && titleEl && starsEl) {
        titleEl.textContent = `🎉 Fantastic Job on ${title}!`;
        starsEl.textContent = `Score: ${score}/${maxScore} • +${stars} ⭐ Stars Added to Your Balance!`;
        banner.style.display = 'block';
      }
    }

    // ==========================================
    // H5P CONTENT PACKAGES (STANDALONE LIBRARY IMPLEMENTATIONS)
    // ==========================================

    // 1. H5P.ArithmeticQuiz (Speed Math)
    H5P.ArithmeticQuiz = function(container, options) {
      const quizType = options.quizType || 'addition';
      const maxQuestions = options.maxQuestions || 5;
      let currentQ = 0;
      let correctCount = 0;
      let answered = false;

      function generateQuestion() {
        let a = Math.floor(Math.random() * 10) + 2;
        let b = Math.floor(Math.random() * 8) + 1;
        let op = '+';
        let ans = a + b;
        if (quizType === 'subtraction') {
          if (b > a) { const tmp = a; a = b; b = tmp; }
          op = '-';
          ans = a - b;
        } else if (quizType === 'multiplication') {
          a = Math.floor(Math.random() * 6) + 2;
          b = Math.floor(Math.random() * 5) + 1;
          op = '×';
          ans = a * b;
        }
        const opts = [ans, ans + 2, Math.max(0, ans - 3), ans + 1].sort(() => Math.random() - 0.5);
        return { a, b, op, ans, opts };
      }

      let qData = generateQuestion();

      function render() {
        container.innerHTML = `
          <div style="font-size:0.75rem; font-weight:800; color:var(--gold); margin-bottom:4px;">
            Question ${currentQ + 1} of ${maxQuestions} • Score: ${correctCount}
          </div>
          <div class="quiz-display">${qData.a} ${qData.op} ${qData.b} = ?</div>
          <div class="grid-2">
            ${qData.opts.map(opt => `
              <button class="choice-btn" onclick="selectAnswer(${opt})">${opt}</button>
            `).join('')}
          </div>
          <div id="h5p-next-btn-container" style="margin-top:14px; display:none;">
            <button class="btn btn-green" style="width:100%;" onclick="nextQuestion()">Next Question →</button>
          </div>
        `;
      }

      window.selectAnswer = function(chosen) {
        if (answered) return;
        answered = true;
        const isRight = chosen === qData.ans;
        if (isRight) correctCount++;
        
        const btns = container.querySelectorAll('.choice-btn');
        btns.forEach(b => {
          const val = parseInt(b.textContent, 10);
          if (val === qData.ans) b.classList.add('correct');
          else if (val === chosen && !isRight) b.classList.add('wrong');
        });

        const nextBox = document.getElementById('h5p-next-btn-container');
        if (nextBox) nextBox.style.display = 'block';
      };

      window.nextQuestion = function() {
        currentQ++;
        answered = false;
        if (currentQ < maxQuestions) {
          qData = generateQuestion();
          render();
        } else {
          // Finished! Trigger xAPI
          const evt = new H5P.XAPIEvent('completed', correctCount, maxQuestions, options.title || 'Arithmetic Speed Sprint');
          H5P.externalDispatcher.trigger('xAPI', evt);
          container.innerHTML = `
            <div style="text-align:center; padding:20px 0;">
              <div style="font-size:3rem; margin-bottom:8px;">⚡ 🏆</div>
              <div style="font-weight:900; font-size:1.3rem; margin-bottom:6px;">Quiz Completed!</div>
              <div style="font-size:0.9rem; color:var(--text-muted); margin-bottom:16px;">You got ${correctCount} out of ${maxQuestions} questions right!</div>
              <button class="btn btn-pink" onclick="H5P.loadContent('${options.id}')">Play Again 🔁</button>
            </div>
          `;
        }
      };

      render();
    };

    // 2. H5P.MemoryGame (Flip & Match Pairs)
    H5P.MemoryGame = function(container, options) {
      const cards = options.cards || ["🦁", "🐬", "🚀", "🎨"];
      const deck = [...cards, ...cards].sort(() => Math.random() - 0.5);
      let flipped = [];
      let matched = [];

      function render() {
        container.innerHTML = `
          <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <div style="font-size:0.75rem; font-weight:800; color:var(--cyan);">Find matching pairs!</div>
            <div style="font-size:0.75rem; color:var(--text-muted);">${matched.length / 2} / ${cards.length} Matched</div>
          </div>
          <div class="grid-4">
            ${deck.map((item, idx) => {
              const isFlipped = flipped.includes(idx) || matched.includes(idx);
              const isMatched = matched.includes(idx);
              return `
                <div class="mem-card ${isFlipped ? 'flipped' : ''} ${isMatched ? 'matched' : ''}" onclick="onCardClick(${idx})">
                  ${isFlipped ? item : '❓'}
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      window.onCardClick = function(idx) {
        if (flipped.length >= 2 || flipped.includes(idx) || matched.includes(idx)) return;
        flipped.push(idx);
        render();

        if (flipped.length === 2) {
          const [c1, c2] = flipped;
          if (deck[c1] === deck[c2]) {
            matched.push(c1, c2);
            flipped = [];
            render();
            if (matched.length === deck.length) {
              const evt = new H5P.XAPIEvent('completed', cards.length, cards.length, options.title || 'Memory Card Match');
              H5P.externalDispatcher.trigger('xAPI', evt);
            }
          } else {
            setTimeout(() => {
              flipped = [];
              render();
            }, 800);
          }
        }
      };

      render();
    };

    // 3. H5P.Flashcards
    H5P.Flashcards = function(container, options) {
      const cards = options.cards || [
        { q: "What animal says 'Moo'?", ans: "Cow", hint: "Gives healthy milk!" },
        { q: "What animal has a mane and roars?", ans: "Lion", hint: "King of the jungle!" },
        { q: "What animal swims and says 'Quack'?", ans: "Duck", hint: "Loves ponds!" }
      ];
      let cur = 0;
      let score = 0;
      let revealed = false;

      function render() {
        const item = cards[cur];
        container.innerHTML = `
          <div style="font-size:0.75rem; font-weight:800; color:var(--pink); margin-bottom:6px;">Card ${cur + 1} of ${cards.length}</div>
          <div class="quiz-display" style="font-size:1.3rem;">${item.q}</div>
          <div style="font-size:0.8rem; color:var(--text-muted); text-align:center; margin-bottom:14px;">💡 Hint: ${item.hint}</div>
          ${revealed ? `
            <div style="background:rgba(6,214,160,0.15); border:1.5px solid var(--green); border-radius:12px; padding:12px; text-align:center; font-weight:800; font-size:1.1rem; color:var(--green); margin-bottom:12px;">
              Answer: ${item.ans}
            </div>
            <button class="btn btn-green" style="width:100%;" onclick="nextCard()">Next Card →</button>
          ` : `
            <button class="btn" style="width:100%;" onclick="revealAnswer()">Show Answer 🔍</button>
          `}
        `;
      }

      window.revealAnswer = function() {
        revealed = true;
        score++;
        render();
      };

      window.nextCard = function() {
        cur++;
        revealed = false;
        if (cur < cards.length) {
          render();
        } else {
          const evt = new H5P.XAPIEvent('completed', score, cards.length, options.title || 'Interactive Flashcards');
          H5P.externalDispatcher.trigger('xAPI', evt);
          container.innerHTML = `
            <div style="text-align:center; padding:20px 0;">
              <div style="font-size:3rem; margin-bottom:8px;">🎴 ✨</div>
              <div style="font-weight:900; font-size:1.2rem; margin-bottom:8px;">All Flashcards Explored!</div>
              <button class="btn btn-pink" onclick="H5P.loadContent('${options.id}')">Review Again 🔁</button>
            </div>
          `;
        }
      };

      render();
    };

    // 4. H5P.DragText (Drag or Tap Words into Sentences)
    H5P.DragText = function(container, options) {
      const sentence = options.sentence || "The *Sun* is a star at the center of our *Solar System*.";
      // Parse words wrapped in asterisks
      const parts = sentence.split('*');
      const blanks = [];
      for (let i = 1; i < parts.length; i += 2) {
        blanks.push(parts[i]);
      }
      const wordBank = [...blanks].sort(() => Math.random() - 0.5);
      const userAnswers = {};
      let selectedWord = null;

      function render() {
        let sentenceHtml = '';
        let blankIndex = 0;
        for (let i = 0; i < parts.length; i++) {
          if (i % 2 === 0) {
            sentenceHtml += `<span>${parts[i]}</span>`;
          } else {
            const bIdx = blankIndex++;
            const placed = userAnswers[bIdx];
            sentenceHtml += `<span class="drop-zone ${placed ? 'filled' : ''}" onclick="placeInSlot(${bIdx})">${placed || '______'}</span>`;
          }
        }

        container.innerHTML = `
          <div style="font-size:0.75rem; font-weight:800; color:var(--cyan); margin-bottom:8px;">Tap a word chip, then tap the blank to fill it in:</div>
          <div style="line-height:2.2; font-size:1rem; font-weight:700; background:#111420; padding:14px; border-radius:12px; margin-bottom:14px; border:1px solid var(--border);">
            ${sentenceHtml}
          </div>
          <div style="margin-bottom:14px;">
            <div style="font-size:0.75rem; color:var(--text-muted); margin-bottom:6px;">Available Word Chips:</div>
            ${wordBank.map(w => {
              const isUsed = Object.values(userAnswers).includes(w);
              const isSel = selectedWord === w;
              return `<button class="word-chip ${isSel ? 'selected' : ''}" style="opacity:${isUsed ? '0.4' : '1'};" onclick="selectWord('${w}')">${w}</button>`;
            }).join('')}
          </div>
          <button class="btn btn-green" style="width:100%;" onclick="checkDragAnswers()">Check Answers ✔️</button>
        `;
      }

      window.selectWord = function(w) {
        selectedWord = w;
        render();
      };

      window.placeInSlot = function(slotIdx) {
        if (selectedWord) {
          userAnswers[slotIdx] = selectedWord;
          selectedWord = null;
          render();
        } else if (userAnswers[slotIdx]) {
          delete userAnswers[slotIdx];
          render();
        }
      };

      window.checkDragAnswers = function() {
        let correct = 0;
        blanks.forEach((b, idx) => {
          if (userAnswers[idx] === b) correct++;
        });

        if (correct === blanks.length) {
          const evt = new H5P.XAPIEvent('completed', blanks.length, blanks.length, options.title || 'Sentence Word Cloze');
          H5P.externalDispatcher.trigger('xAPI', evt);
          container.innerHTML = `
            <div style="text-align:center; padding:20px 0;">
              <div style="font-size:3rem; margin-bottom:8px;">🌟 📝</div>
              <div style="font-weight:900; font-size:1.2rem; color:var(--green); margin-bottom:8px;">All Words Placed Perfectly!</div>
              <button class="btn btn-pink" onclick="H5P.loadContent('${options.id}')">Play Again 🔁</button>
            </div>
          `;
        } else {
          alert(`You placed ${correct} of ${blanks.length} words correctly. Keep trying!`);
        }
      };

      render();
    };

    // 5. H5P.ImageChoice (Toddler Visual Picture Choice)
    H5P.ImageChoice = function(container, options) {
      const q = options.question || "Find the friendly Cow 🐮!";
      const choices = options.choices || [
        { label: "Cow", emoji: "🐮", correct: true },
        { label: "Lion", emoji: "🦁", correct: false },
        { label: "Duck", emoji: "🦆", correct: false }
      ];

      container.innerHTML = `
        <div style="text-align:center; margin-bottom:14px;">
          <div style="font-size:0.75rem; font-weight:800; color:var(--pink); margin-bottom:4px;">Picture Quest</div>
          <div style="font-size:1.15rem; font-weight:800;">${q}</div>
        </div>
        <div class="grid-3">
          ${choices.map((c, i) => `
            <button class="choice-btn" style="padding:16px 8px;" onclick="choosePic(${i})">
              <div style="font-size:2.8rem;">${c.emoji}</div>
              <div style="font-size:0.85rem; font-weight:800; margin-top:6px;">${c.label}</div>
            </button>
          `).join('')}
        </div>
      `;

      window.choosePic = function(idx) {
        const item = choices[idx];
        const btns = container.querySelectorAll('.choice-btn');
        if (item.correct) {
          btns[idx].classList.add('correct');
          const evt = new H5P.XAPIEvent('completed', 1, 1, options.title || 'Picture Match Quest');
          H5P.externalDispatcher.trigger('xAPI', evt);
        } else {
          btns[idx].classList.add('wrong');
        }
      };
    };

    // ==========================================
    // PRE-PACKAGED H5P ACTIVITIES CATALOG
    // ==========================================
    const H5P_ACTIVITIES = {
      // Toddlers
      'toddler-animals': {
        type: 'ImageChoice',
        title: 'Farm Picture Match',
        desc: 'Find the friendly animals on the farm!',
        options: {
          id: 'toddler-animals',
          title: 'Farm Picture Match',
          question: 'Find the happy Cow 🐮 on the farm!',
          choices: [
            { label: 'Cow', emoji: '🐮', correct: true },
            { label: 'Lion', emoji: '🦁', correct: false },
            { label: 'Frog', emoji: '🐸', correct: false }
          ]
        }
      },
      'toddler-memory': {
        type: 'MemoryGame',
        title: 'Toddler Animal Memory',
        desc: 'Flip and match 3 pairs of cute animal friends!',
        options: {
          id: 'toddler-memory',
          title: 'Toddler Animal Memory',

    H5P.loadContent = function(contentId) {
      const banner = document.getElementById('celebration-banner');
      if (banner) banner.style.display = 'none';

      const activity = H5P_ACTIVITIES[contentId] || H5P_ACTIVITIES['young-speed-math'];
      document.getElementById('h5p-title').textContent = activity.title;
      document.getElementById('h5p-desc').textContent = activity.desc;

      const container = document.getElementById('h5p-container');
      if (H5P[activity.type]) {
        new H5P[activity.type](container, activity.options);
      }
    };

    // Read URL param or default
    const urlParams = new URLSearchParams(window.location.search);
    const initialId = urlParams.get('id') || 'young-speed-math';
    H5P.loadContent(initialId);
